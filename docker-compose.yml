services:
  postgres:
    image: postgres:16
    container_name: frontend-assessment-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: assessment
      POSTGRES_PASSWORD: assessment
      POSTGRES_DB: frontend_assessment
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assessment -d frontend_assessment"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ./database/assessment.sql:/docker-entrypoint-initdb.d/001-assessment.sql:ro
